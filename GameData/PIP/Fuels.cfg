// Generated by Tools\Generate-Fuels.ps1. Edit that script, not this file.
// The fuels liquid engine programs can burn (DESIGN.md section 19, FUELS.md).
//
// Add a fuel of your own with a PIP_FUEL node in any .cfg: code (letters, no "-"),
// title, tech (a tech node id, or empty for the first liquid engines), note,
// PROPELLANT nodes as on an engine, ISP with four numbers per nozzle (sea level at
// 0 and 100 points, vacuum at 0 and 100 points), and thrust, twr, price, failHi and
// failLo. A TANK node puts a B9_TANK_TYPE on PIP's tanks: kind S (storable: standard
// tanks) or C (cryogenic: standard tanks, where it boils off fast, and cryogenic
// tanks, which insulate and cool it). A PLUME node names Waterfall templates for its
// engines by role (lower, upper, core, generator), best first, and "match": words
// in a template name that mean it is already this fuel's. A fuel whose resources
// aren't installed is left out.

// Boil-off: % of the resource lost per hour, and electric charge per second per
