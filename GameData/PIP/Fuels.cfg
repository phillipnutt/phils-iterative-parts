// Prices. Community Resource Pack's are near real, which makes filling a tank with
// the exotic fuels 6 to 100 times dearer than kerolox (ClF5: 19,432 for an
// FL-T400). PIP sets these resources' prices so a fuel costs what its
// performance is worth (FUELS.md), everywhere in the game. Real Fuels keeps its own.
